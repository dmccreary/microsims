<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>PII Surface Explorer using p5.js</title>
    <style>
        body { margin: 0px; padding: 0px; font-family: Arial, Helvetica, sans-serif; }
        main button, main label, main span, main input { font-size: 14px; font-family: Arial, Helvetica, sans-serif; }
        main button { padding: 5px 9px; }
        .radio-group { width: max-content; height: 30px; display: flex; align-items: center; white-space: nowrap; gap: 4px; }
        .radio-group > div { display: flex; align-items: center; gap: 2px; }
        .radio-group label { margin-right: 8px; }
        main button:focus-visible, main input:focus-visible { outline: 3px solid #003c82; outline-offset: 2px; }
        main canvas:focus-visible { outline: 3px dashed #003c82; outline-offset: -3px; }
        .sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden;
                   clip: rect(0 0 0 0); white-space: nowrap; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>
    <script src="pii-surface-explorer.js"></script>
</head>
<body>
    <main></main>
    <br/>
    <a href=".">Back to Lesson Plan</a>
</body>
</html>
