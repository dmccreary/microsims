<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Set Overlap Explorer using venn.js</title>
    <link rel="stylesheet" href="style.css">
    <!-- D3.js and venn.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/venn.js@0.2.20/venn.js"></script>
</head>
<body>
    <main>
        <div class="top-bar">
            <button type="button" id="mode-btn" aria-pressed="false">Start Classify mode</button>
            <span class="mode-status" id="mode-status">Explore: hover a region for its definition, click it for two examples.</span>
        </div>
        <div class="work">
            <div class="venn-col">
                <div id="venn-diagram" role="img" aria-label="Three-circle Venn diagram of ordered process, labeled relationships and feedback"></div>
            </div>
            <aside class="panel" id="panel" aria-live="polite"></aside>
        </div>
    </main>
    <div id="tooltip" class="venn-tooltip" role="tooltip"></div>
    <script src="set-overlap-explorer.js"></script>
</body>
</html>
