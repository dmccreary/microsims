# Dan's MicroSite Standards from here down
theme:
  name: material
  logo: img/logo.png
  favicon: img/favicon.ico
  include_sidebar: true
  features:
    - content.code.copy
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - toc.follow
    - navigation.top
    # this adds the prev and next icons in the footer
    - navigation.footer
    - content.action.edit
plugins:
  - search
  - social

hooks:
  - plugins/social_override.py

markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - meta
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      linenums: true

# Remove this line once the seven mascot PNGs exist in docs/img/mascot/
exclude_docs: |
  learning-graph/mascot-test.md

extra_css:
   - css/extra.css
   - css/mascot.css

extra_javascript:
  - js/extra.js
  # required for rendering math equations
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

