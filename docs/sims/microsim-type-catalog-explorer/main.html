<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>MicroSim Type Catalog Explorer using vis-network 9.1.9</title>
    <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/styles/vis-network.min.css">
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; overflow: hidden; font-family: Arial, Helvetica, sans-serif; background: white; }
        main { display: block; width: 100%; }
        #toolbar {
            display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px;
            padding: 6px 10px; border: 1px solid silver; border-bottom: none; background: white;
        }
        #toolbar .title { font-size: 18px; font-weight: bold; margin-right: auto; }
        #toolbar button { font-size: 14px; padding: 3px 10px; }
        #layout { display: flex; width: 100%; border: 1px solid silver; }
        #network-wrap { position: relative; flex: 0 0 62%; background: aliceblue; }
        #network { width: 100%; height: 100%; }
        #info-panel {
            flex: 1 1 auto; border-left: 1px solid silver; background: white; overflow: hidden;
            padding: 10px 12px; font-size: 14px; line-height: 1.4; color: #222;
        }
        #info-panel h3 { margin: 0 0 4px 0; font-size: 1.25em; color: midnightblue; }
        #info-panel .lib { display: inline-block; margin: 2px 0 6px 0; padding: 1px 8px; border-radius: 10px; font-size: 0.93em; font-weight: bold; }
        #info-panel p { margin: 5px 0; }
        #info-panel .label { font-weight: bold; }
        #info-panel .ex { background: honeydew; border-left: 4px solid seagreen; padding: 4px 8px; margin: 6px 0; }
        #info-panel .miss { background: mistyrose; border-left: 4px solid indianred; padding: 4px 8px; margin: 6px 0; }
        #info-panel .hint { color: dimgray; font-style: italic; }
        #info-panel .quiz { background: lightyellow; border: 1px solid goldenrod; border-radius: 6px; padding: 8px; margin: 6px 0; font-size: 1.07em; }
        #info-panel .ok { color: darkgreen; font-weight: bold; }
        #info-panel .bad { color: firebrick; font-weight: bold; }
        #info-panel button { font-size: 14px; margin-top: 6px; }
        div.vis-tooltip { font-family: Arial, Helvetica, sans-serif; font-size: 14px; }
        @media (max-width: 599px) {
            #layout { flex-direction: column; }
            #network-wrap { flex: none; }
            #info-panel { border-left: none; border-top: 1px solid silver; font-size: 13px; }
        }
    </style>
    <script src="microsim-type-catalog-explorer.js"></script>
</head>
<body>
    <main>
        <div id="toolbar">
            <span class="title">MicroSim Type Catalog</span>
            <button id="quiz-btn">Quiz me</button>
            <button id="fit-btn">Fit view</button>
        </div>
        <div id="layout">
            <div id="network-wrap">
                <div id="network"></div>
            </div>
            <div id="info-panel"></div>
        </div>
    </main>
    <br/>
    <a href=".">Back to Lesson Plan</a>
</body>
</html>
